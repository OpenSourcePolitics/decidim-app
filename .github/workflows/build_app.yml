on:
  workflow_call:
    inputs:
      ruby_version:
        description: 'Ruby Version'
        default: "3.2.11"
        type: string
        required: false
      ruby_cache_key:
        description: 'Cache key of a prebuilt patched Ruby (~/.ruby-patched). When set, that Ruby is used instead of ruby/setup-ruby.'
        default: ""
        type: string
        required: false
      node_version:
        description: 'Node version'
        default: '22.13.1'
        required: false
        type: string
jobs:
  build_app:
    name: Build app
    runs-on: ubuntu-22.04
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 60
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      RUBYOPT: '-W:no-deprecated'
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        if: inputs.ruby_cache_key == ''
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
      - name: Restore patched Ruby
        if: inputs.ruby_cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.ruby-patched
          key: ${{ inputs.ruby_cache_key }}
          fail-on-cache-miss: true
      - name: Use patched Ruby and install gems
        if: inputs.ruby_cache_key != ''
        shell: "bash"
        run: |
          echo "$HOME/.ruby-patched/${{ inputs.ruby_version }}/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.ruby-patched/${{ inputs.ruby_version }}/bin:$PATH"
          ruby -v
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - run: npm config set fetch-retries 5 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-retry-maxtimeout 120000
        name: Tune NPM configuration
        shell: "bash"
      - uses: actions/cache@v4
        id: app-cache
        with:
          path: ./
          key: app-${{ github.sha }}
          restore-keys: app-${{ github.sha }}
      - run: bundle exec rake test:setup
        name: Create test app
        shell: "bash"
      - run: mkdir -p ./spec/tmp/screenshots
        name: Create the screenshots folder
        shell: "bash"
      - run: npm install
        name: Install JS dependencies
        shell: "bash"
        env:
          NODE_ENV: test
      - run: bundle exec rails shakapacker:compile
        name: Precompile assets
        shell: "bash"
        env:
          NODE_ENV: "test"
          RAILS_ENV: "test"
