    help:
      main_topic:
        description: Prečítajte si viac o %{organization}.
        title: Všeobecné
      participatory_spaces:
        assemblies:
          contextual: "<p><strong>Zhromaždenie</strong> je skupina členov organizácie, ktorí sa pravidelne stretávajú, aby prijímali rozhodnutia o konkrétnej oblasti alebo rozsahu pôsobnosti organizácie.</p> <p>Zhromaždenia organizujú stretnutia, niektoré sú neverejné a niektoré verejné. Ak sú verejné, je možné sa na nich zúčastniť (napríklad: účasť, ak to kapacita dovoľuje, pridávanie bodov do programu alebo pripomienkovanie návrhov a rozhodnutí prijatých týmto orgánom).</p> <p>Príklady: Valné zhromaždenie (ktoré sa schádza raz ročne, aby hlasovaním určilo hlavné smery činnosti organizácie, ako aj jej výkonné orgány), poradný výbor pre rovnosť (ktorý sa schádza každé dva mesiace, aby predkladal návrhy na zlepšenie rodových vzťahov v organizácii), hodnotiaca komisia (ktorá sa schádza každý mesiac, aby monitorovala proces) alebo garančný orgán (ktorý zhromažďuje incidenty, zneužitia alebo návrhy na zlepšenie rozhodovacích postupov) sú všetko príklady zhromaždení.</p>\n"
          page: "<p><strong>Zhromaždenie</strong> je skupina členov organizácie, ktorí sa pravidelne stretávajú, aby prijímali rozhodnutia o konkrétnej oblasti alebo rozsahu pôsobnosti organizácie.</p> <p>Zhromaždenia organizujú stretnutia, niektoré sú neverejné a niektoré verejné. Ak sú verejné, je možné sa na nich zúčastniť (napríklad: účasť, ak to kapacita dovoľuje, pridávanie bodov do programu alebo pripomienkovanie návrhov a rozhodnutí prijatých týmto orgánom).</p> <p>Príklady: Valné zhromaždenie (ktoré sa schádza raz ročne, aby hlasovaním určilo hlavné smery činnosti organizácie, ako aj jej výkonné orgány), poradný výbor pre rovnosť (ktorý sa schádza každé dva mesiace, aby predkladal návrhy na zlepšenie rodových vzťahov v organizácii), hodnotiaca komisia (ktorá sa schádza každý mesiac, aby monitorovala proces) alebo garančný orgán (ktorý zhromažďuje incidenty, zneužitia alebo návrhy na zlepšenie rozhodovacích postupov) sú všetko príklady zhromaždení.</p>\n"
          title: Čo sú zhromaždenia?
        conferences:
          contextual: "<p><strong>Konferencia</strong> je súbor stretnutí usporiadaných do programu s množstvom ľudí pozvaných ako rečníci a ďalšími informačnými poľami typickými pre veľké kongresy alebo spoločenské podujatia (registrácia, zoznam organizácií, ktoré podujatie podporujú alebo sponzorujú atď.).</p> <p>Príklady: Konferencia môže byť relevantným podujatím pre organizáciu a jej členov, alebo sa môže uskutočniť ako súčasť participatívneho procesu či nasledovať po konzultácii.</p>\n"
          page: "<p><strong>Konferencia</strong> je súbor stretnutí usporiadaných do programu s množstvom ľudí pozvaných ako rečníci a ďalšími informačnými poľami typickými pre veľké kongresy alebo spoločenské podujatia (registrácia, zoznam organizácií, ktoré podujatie podporujú alebo sponzorujú atď.).</p> <p>Príklady: Konferencia môže byť relevantným podujatím pre organizáciu a jej členov, alebo sa môže uskutočniť ako súčasť participatívneho procesu či nasledovať po konzultácii.</p>\n"
          title: Čo sú konferencie?
        initiatives:
          contextual: "<p><strong>Iniciatíva</strong> je návrh, ktorý môže ktokoľvek z vlastnej iniciatívy (nezávisle od iných kanálov alebo participatívnych priestorov) presadzovať prostredníctvom zberu (digitálnych) podpisov, aby organizácia vykonala konkrétnu akciu (úprava predpisu, začatie projektu, zmena názvu oddelenia alebo ulice atď.).</p> <p>Predkladatelia iniciatívy môžu definovať jej ciele, získavať podporu, diskutovať, šíriť ju a definovať miesta stretnutí, kde sa môžu zbierať podpisy od účastníkov alebo otvárať diskusie pre ďalších účastníkov.</p> <p>Príklady: Iniciatíva môže zbierať podpisy na zvolanie konzultácie medzi všetkými ľuďmi v organizácii, na vytvorenie alebo zvolanie zhromaždenia, alebo na začatie procesu zvýšenia rozpočtu pre určité územie alebo oblasť organizácie. Počas procesu zberu podpisov sa k tejto požiadavke môže pridať viac ľudí a posunúť ju v organizácii ďalej.</p>\n"
